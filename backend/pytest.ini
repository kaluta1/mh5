[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Pure logic tests with no external I/O (fast).
    integration: API or DB layer tests with TestClient and in-memory SQLite.
    regression: Guards against previously fixed bugs (schema drift, payment tolerance, etc.).
    functional: Multi-step business flows within the backend.
    e2e: End-to-end user journeys through the HTTP API.
    postgres: Requires a live PostgreSQL DATABASE_URL (skipped by default).

addopts =
    -ra
    --strict-markers
