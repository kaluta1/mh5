services:
  - type: web
    name: mh5-backend
    env: python
    region: oregon  # Change to your preferred region
    plan: free  # or starter, standard, etc.
    buildCommand: pip install -r requirements.txt && alembic upgrade heads
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SECRET_KEY
        sync: false  # Set manually - CRITICAL!
      - key: BACKEND_CORS_ORIGINS
        value: https://frontend-rho-eight-72.vercel.app
      - key: FRONTEND_URL
        sync: false # e.g. https://myhigh5.com — must match the public site; used for Shufti URL fallback + redirects
      - key: BACKEND_PUBLIC_URL
        sync: false # use https://api.myhigh5.com in production (webhook base + callback base)
      - key: ANNUALADS_TENANT_ID
        sync: false
      - key: ANNUALADS_API_KEY
        sync: false
      - key: ANNUALADS_SSO_SECRET
        sync: false
      - key: ANNUALADS_WEBHOOK_SECRET
        sync: false
      - key: SHUFTI_CALLBACK_URL
        sync: false # optional override: https://YOUR_DOMAIN/api/v1/kyc/webhook/shufti-pro
      - key: SHUFTI_REDIRECT_URL
        sync: false # optional override: https://YOUR_DOMAIN/api/v1/kyc/redirect
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: STORAGE_TYPE
        value: s3
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_SANDBOX
        value: false
      - key: NOWPAYMENTS_DEFAULT_PAY_CURRENCY
        value: usdttrc20

databases:
  - name: mh5-database
    databaseName: myhigh5
    user: myhigh5_user
    plan: free  # or starter, standard, etc.
    region: oregon  # Should match service region
