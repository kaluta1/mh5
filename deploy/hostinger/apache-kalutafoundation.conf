<VirtualHost *:80>
    ServerName kalutafoundation.com
    ServerAlias www.kalutafoundation.com

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /socket.io/ http://127.0.0.1:8001/socket.io/ upgrade=websocket retry=0 timeout=120
    ProxyPassReverse /socket.io/ http://127.0.0.1:8001/socket.io/

    ProxyPass /api/ http://127.0.0.1:8001/api/ retry=0 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/
    ProxyPass /graphql http://127.0.0.1:8001/graphql retry=0 timeout=120
    ProxyPassReverse /graphql http://127.0.0.1:8001/graphql
    ProxyPass /media/ http://127.0.0.1:8001/media/ retry=0 timeout=120
    ProxyPassReverse /media/ http://127.0.0.1:8001/media/

    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/kalutafoundation-error.log
    CustomLog ${APACHE_LOG_DIR}/kalutafoundation-access.log combined
</VirtualHost>
